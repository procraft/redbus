syntax = "proto3";

package redbus.admincontrol.v1;

option go_package = "github.com/prokraft/redbus/internal/api/admincontrol";

service AdminControlService {
  rpc GetStateSnapshot(Empty) returns (StateSnapshot) {}
  rpc GetTopicStats(Empty) returns (TopicStats) {}
  rpc GetRetryStats(Empty) returns (RetryStats) {}
  rpc RestartFailed(RestartFailedRequest) returns (Empty) {}
  rpc RestartFailedSince(RestartFailedSinceRequest) returns (Empty) {}
  rpc RestartFailedByError(RestartFailedByErrorRequest) returns (Empty) {}
  rpc DeleteFailedByError(DeleteFailedByErrorRequest) returns (Empty) {}
}

message Empty {}

message StateSnapshot {
  int32 consume_topic_count = 1;
  int32 consumer_count = 2;
  int32 repeat_all_count = 3;
  int32 repeat_failed_count = 4;
}

message TopicStats {
  repeated Topic list = 1;
}

message Topic {
  string name = 1;
  repeated Partition partitions = 2;
  repeated Group groups = 3;
}

message Partition {
  int32 number = 1;
  int64 first_offset = 2;
  int64 last_offset = 3;
}

message Group {
  string name = 1;
  repeated GroupPartition partitions = 2;
  repeated Consumer consumers = 3;
  string kafka_group_id = 4;
  string state = 5;
  string error = 6;
}

message Consumer {
  string id = 1;
  string state = 2;
  string topic = 3;
  string group = 4;
  int64 connected_at_unix_ms = 5;
  int64 state_since_unix_ms = 6;
  int64 last_message_at_unix_ms = 7;
  uint64 messages_processed = 8;
  uint64 reconnect_count = 9;
  string last_error = 10;
  string repeat_strategy = 11;
  string kafka_member_id = 12;
  string client_host = 13;
  repeated ConsumerPartition partitions = 14;
}

message ConsumerPartition {
  int32 number = 1;
  int64 group_offset = 2;
  int64 last_offset = 3;
  int64 lag = 4;
  bool committed = 5;
}

message GroupPartition {
  int32 number = 1;
  int64 offset = 2;
  string consumer_id = 3;
  string consumer_state = 4;
  int64 first_offset = 5;
  int64 last_offset = 6;
  int64 lag = 7;
  bool committed = 8;
}

message RetryStats {
  repeated RetryStat list = 1;
}

message RetryStat {
  string topic = 1;
  string group = 2;
  int32 all_count = 3;
  int32 failed_count = 4;
  string last_error = 5;
  repeated RetryErrorStat errors = 6;
}

message RetryErrorStat {
  string error = 1;
  int32 failed_count = 2;
  int64 first_failed_at_unix_ms = 3;
  int64 last_failed_at_unix_ms = 4;
}

message RestartFailedRequest {
  string topic = 1;
  string group = 2;
}

message RestartFailedSinceRequest {
  string topic = 1;
  string group = 2;
  int64 lookback_seconds = 3;
}

message RestartFailedByErrorRequest {
  string topic = 1;
  string group = 2;
  string error = 3;
  int64 lookback_seconds = 4;
}

message DeleteFailedByErrorRequest {
  string topic = 1;
  string group = 2;
  string error = 3;
}
